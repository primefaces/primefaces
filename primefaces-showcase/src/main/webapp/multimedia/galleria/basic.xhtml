<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        Galleria
    </ui:define>

    <ui:define name="description">
        Galleria is a content gallery component. The items are iterated from a collection with <b>value</b> and
        <b>var</b>, the <b>thumbnail</b> facet defines the thumbnail of an item and <b>numVisible</b> the number of items
        per page. With <b>loading="lazy"</b> on the images the browser only loads the images that are displayed.
    </ui:define>

    <ui:param name="documentationLink" value="/components/galleria"/>
    <ui:param name="componentLink" value="Galleria"/>
    <ui:param name="tagName" value="galleria"/>

    <ui:define name="implementation">
        <div class="card">
            <p:galleria value="#{galleriaView.photos}" var="photo" numVisible="5" style="max-width: 640px">
                <p:graphicImage name="#{photo.itemImageSrc}" alt="#{photo.alt}" style="width: 100%" loading="lazy" />
                <f:facet name="thumbnail">
                    <p:graphicImage name="#{photo.thumbnailImageSrc}" alt="#{photo.alt}" loading="lazy" />
                </f:facet>
            </p:galleria>
        </div>
    </ui:define>

</ui:composition>
