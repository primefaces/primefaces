<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        Charts <span class="subitem">Line</span>
    </ui:define>

    <ui:define name="description">
        A line chart is created with raw JSON or using an
        <a href="https://github.com/xdev-software/chartjs-java-model" target="_blank" rel="noopener noreferrer">XDEV</a>
        model, as in this demo. The first chart shows a single dataset, the second one two filled datasets
        that each use their own y axis, one on the left and one on the right.
    </ui:define>

    <ui:param name="documentationLink" value="/components/chart" />
    <ui:param name="componentLink" value="Chart-1" />
    <ui:param name="tagName" value="chart"/>

    <ui:define name="implementation">
        <div class="card">
            <p:chart value="#{chartView.lineModel}" style="width: 100%; height: 500px;"/>
        </div>

        <div class="card">
            <p:chart value="#{chartView.cartesianLinerModel}" style="width: 100%; height: 500px;"/>
        </div>
    </ui:define>

</ui:composition>
