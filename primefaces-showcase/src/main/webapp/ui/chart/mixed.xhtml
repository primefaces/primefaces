<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        Charts <span class="subitem">Mixed</span>
    </ui:define>

    <ui:define name="description">
        A mixed chart combines several chart types, in this demo a bar dataset and a stepped line dataset using the
        <a href="https://github.com/xdev-software/chartjs-java-model" target="_blank" rel="noopener noreferrer">XDEV</a>
        model. When a data point is clicked, the <b>itemSelect</b> Ajax behavior passes its value, item index and
        dataset index to the backing bean, which shows them in a message.
    </ui:define>

    <ui:param name="documentationLink" value="/components/chart"/>
    <ui:param name="componentLink" value="Chart-1"/>
    <ui:param name="tagName" value="chart"/>

    <ui:define name="implementation">
        <h:form>
            <p:growl id="growl" showDetail="true"/>

            <div class="card">
                <h5>Mixed</h5>
                <p:chart value="#{chartView.mixedModel}" style="width: 100%; height: 500px;">
                    <p:ajax event="itemSelect" listener="#{chartView.itemSelect}" update="growl"/>
                </p:chart>
            </div>
    
        </h:form>
    </ui:define>

</ui:composition>
