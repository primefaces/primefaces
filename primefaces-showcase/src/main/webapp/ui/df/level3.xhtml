<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">
<h:head>
    <title>Level 3</title>
    <style>
        html {
            font-size: 14px;
        }
    </style>
</h:head>
<h:body>
    <div style="padding: 1rem">
        <h:form id="level3form">
            <p class="p-widget" style="margin-top: 0">
                Welcome to Level 3, enter value and click send to transfer data from level 3 back to level 2.
            </p>

            <div class="formgrid grid p-fluid">
                <div class="field col-12">
                    <p:outputLabel for="val" value="Return Value"/>
                    <p:inputText id="val" value="#{dfLevel3View.val}"/>
                </div>
            </div>

            <p:commandButton value="Send" action="#{dfLevel3View.closeDialog()}" />
        </h:form>
    </div>
</h:body>
</html>
