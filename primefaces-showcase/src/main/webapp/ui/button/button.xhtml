<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="head">
        <style>
            body button.p-button {
                margin-right: .5rem;
            }
        </style>
    </ui:define>

    <ui:define name="title">
        Button
    </ui:define>

    <ui:define name="description">
        Button is a navigation component based on GET requests targeting bookmarkable URLs.
    </ui:define>

    <ui:param name="documentationLink" value="/components/button"/>
    <ui:param name="widgetLink" value="Button"/>
    <ui:param name="tagName" value="button"/>

    <ui:define name="implementation">
        <div class="card">
            <h5>Basic</h5>
            <p:button value="Submit" />
            <p:button value="Disabled" disabled="true" />

            <h5>Icons</h5>
            <p:button icon="pi pi-check" title="Save" />
            <p:button value="Submit" icon="pi pi-check" />
            <p:button value="Submit" icon="pi pi-check" iconPos="right" />

            <h5>Severities</h5>
            <p:button value="Primary" />
            <p:button value="Secondary" styleClass="p-button-secondary" />
            <p:button value="Success" styleClass="p-button-success" />
            <p:button value="Info" styleClass="p-button-info" />
            <p:button value="Warning" styleClass="p-button-warning" />
            <p:button value="Help" styleClass="p-button-help" />
            <p:button value="Danger" styleClass="p-button-danger" />

            <h5>Raised Buttons</h5>
            <p:button value="Primary" styleClass="p-button-raised" />
            <p:button value="Secondary" styleClass="p-button-raised p-button-secondary" />
            <p:button value="Success" styleClass="p-button-raised p-button-success" />
            <p:button value="Info" styleClass="p-button-raised p-button-info" />
            <p:button value="Warning" styleClass="p-button-raised p-button-warning" />
            <p:button value="Help" styleClass="p-button-raised p-button-help" />
            <p:button value="Danger" styleClass="p-button-raised p-button-danger" />

            <h5>Rounded Buttons</h5>
            <p:button value="Primary" styleClass="rounded-button" />
            <p:button value="Secondary" styleClass="rounded-button p-button-secondary" />
            <p:button value="Success" styleClass="rounded-button p-button-success" />
            <p:button value="Info" styleClass="rounded-button p-button-info" />
            <p:button value="Warning" styleClass="rounded-button p-button-warning" />
            <p:button value="Help" styleClass="rounded-button p-button-help" />
            <p:button value="Danger" styleClass="rounded-button p-button-danger" />

            <h5>Flat Buttons</h5>
            <p:button value="Primary" styleClass="p-button-flat" />
            <p:button value="Secondary" styleClass="p-button-secondary p-button-flat" />
            <p:button value="Success" styleClass="p-button-success p-button-flat" />
            <p:button value="Info" styleClass="p-button-info p-button-flat" />
            <p:button value="Warning" styleClass="p-button-warning p-button-flat" />
            <p:button value="Help" styleClass="p-button-help p-button-flat" />
            <p:button value="Danger" styleClass="p-button-danger p-button-flat" />
            <p:button value="Plain" styleClass="p-button-flat p-button-plain" />

            <h5>Raised Text Buttons</h5>
            <p:button value="Primary" styleClass="p-button-raised p-button-flat" />
            <p:button value="Secondary" styleClass="p-button-raised p-button-secondary p-button-flat" />
            <p:button value="Success" styleClass="p-button-raised p-button-success p-button-flat" />
            <p:button value="Info" styleClass="p-button-raised p-button-info p-button-flat" />
            <p:button value="Warning" styleClass="p-button-raised p-button-warning p-button-flat" />
            <p:button value="Help" styleClass="p-button-raised p-button-help p-button-flat" />
            <p:button value="Danger" styleClass="p-button-raised p-button-danger p-button-flat" />
            <p:button value="Plain" styleClass="p-button-raised p-button-flat p-button-plain" />

            <h5>Outlined Buttons</h5>
            <p:button value="Primary" styleClass="p-button-outlined" />
            <p:button value="Secondary" styleClass="p-button-outlined p-button-secondary" />
            <p:button value="Success" styleClass="p-button-outlined p-button-success" />
            <p:button value="Info" styleClass="p-button-outlined p-button-info" />
            <p:button value="Warning" styleClass="p-button-outlined p-button-warning" />
            <p:button value="Help" styleClass="p-button-outlined p-button-help" />
            <p:button value="Danger" styleClass="p-button-outlined p-button-danger" />

            <h5>Rounded Icon Buttons</h5>
            <p:button icon="pi pi-bookmark" styleClass="rounded-button p-button-secondary" />
            <p:button icon="pi pi-search" styleClass="rounded-button p-button-success" />
            <p:button icon="pi pi-user" styleClass="rounded-button p-button-info" />
            <p:button icon="pi pi-bell" styleClass="rounded-button p-button-warning" />
            <p:button icon="pi pi-heart" styleClass="rounded-button p-button-help" />
            <p:button icon="pi pi-times" styleClass="rounded-button p-button-danger" />
            <p:button icon="pi pi-check" styleClass="rounded-button" />

            <h5>Rounded Text Icon Buttons</h5>
            <p:button icon="pi pi-check" styleClass="rounded-button p-button-flat" />
            <p:button icon="pi pi-bookmark" styleClass="rounded-button p-button-secondary p-button-flat" />
            <p:button icon="pi pi-search" styleClass="rounded-button p-button-success p-button-flat" />
            <p:button icon="pi pi-user" styleClass="rounded-button p-button-info p-button-flat" />
            <p:button icon="pi pi-bell" styleClass="rounded-button p-button-warning p-button-flat" />
            <p:button icon="pi pi-heart" styleClass="rounded-button p-button-help p-button-flat" />
            <p:button icon="pi pi-times" styleClass="rounded-button p-button-danger p-button-flat" />
            <p:button icon="pi pi-filter" styleClass="rounded-button p-button-flat p-button-plain" />

            <h5>Rounded and Outlined Icon Buttons</h5>
            <p:button icon="pi pi-check" styleClass="rounded-button p-button-outlined" />
            <p:button icon="pi pi-bookmark" styleClass="rounded-button p-button-secondary p-button-outlined" />
            <p:button icon="pi pi-search" styleClass="rounded-button p-button-success p-button-outlined" />
            <p:button icon="pi pi-user" styleClass="rounded-button p-button-info p-button-outlined" />
            <p:button icon="pi pi-bell" styleClass="rounded-button p-button-warning p-button-outlined" />
            <p:button icon="pi pi-heart" styleClass="rounded-button p-button-help p-button-outlined" />
            <p:button icon="pi pi-times" styleClass="rounded-button p-button-danger p-button-outlined" />

            <h5 id="sizes">Sizes</h5>
            <p:button value="Small" icon="pi pi-check" size="small" />
            <p:button value="Normal" icon="pi pi-check" />
            <p:button value="Large" icon="pi pi-check" size="large" />
        </div>
    </ui:define>

</ui:composition>
