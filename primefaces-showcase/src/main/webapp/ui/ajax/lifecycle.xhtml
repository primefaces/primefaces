<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        Ajax Framework <span class="subitem">Lifecycle</span>
    </ui:define>

    <ui:define name="description">
        Attach events to the component lifecycle so you can call client side Javascript during PostConstruct, PostRefresh, or PreDestroy of the component.
    </ui:define>

    <ui:param name="documentationLink" value="/core/components?id=component-lifecycle-events"/>
    <ui:param name="tagName" value="ajax"/>

    <ui:define name="implementation">
        <div class="card">
            <h:form id="form">
                <p:growl ref="msgs" />

                <div class="formgrid grid p-fluid">
                    <div class="field col-12 md:col-6">
                        <p:outputLabel for="name" value="Name"/>
                        <p:inputText id="name" value="#{lifecycleView.text}" ref="name">
                            <f:attribute name="clientPreConstruct" value="PF('msgs').renderMessage({severity: 'info', summary: cfg.id + ' Component Initialized'})"/>
                            <f:attribute name="clientPostConstruct" value="PF('msgs').renderMessage({severity: 'info', summary: component.id + ' Component Created'})"/>
                            <f:attribute name="clientPostRefresh" value="PF('msgs').renderMessage({severity: 'info', summary: component.id + ' Component Refreshed'})"/>
                            <f:attribute name="clientPreDestroy" value="PF('msgs').renderMessage({severity: 'info', summary: component.id + ' Component Destroyed'})"/>
                        </p:inputText>
                    </div>
                </div>

                <p:commandButton value="Submit" update="@form" icon="pi pi-check" styleClass="mr-2" />
                <p:commandButton value="Destroy" icon="pi pi-times" onclick="PF('name').destroy(); return false" styleClass="p-button-danger" />
            </h:form>
        </div>
    </ui:define>

</ui:composition>
