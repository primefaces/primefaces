<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="head">
        <style>
            /* the state icons are tokens: here for one checkbox, in :root for all */
            .custom-icons-tristate {
                --p-checkbox-checked-icon: var(--p-icon-plus);
                --p-checkbox-crossed-icon: var(--p-icon-minus);
            }
        </style>
    </ui:define>

    <ui:define name="title">
        TriStateCheckbox
    </ui:define>

    <ui:define name="description">
        TriStateCheckbox add a new state to a checkbox value.
    </ui:define>

    <ui:param name="documentationLink" value="/components/tristatecheckbox"/>
    <ui:param name="widgetLink" value="TriStateCheckbox-1"/>
    <ui:param name="tagName" value="triStateCheckbox"/>

    <ui:define name="implementation">
        <div class="card">
            <h:form>
                <p:growl id="growl" showDetail="true"/>

                <h5 class="mt-0">Basic</h5>
                <p:triStateCheckbox value="#{triStateCheckboxView.value1}"/>

                <h5>Remote</h5>
                <p:triStateCheckbox id="ajaxTriState" value="#{triStateCheckboxView.value2}">
                    <p:ajax event="change" update="growl" listener="#{triStateCheckboxView.addMessage}"/>
                </p:triStateCheckbox>

                <h5>Custom Icons and Label</h5>
                <p:triStateCheckbox value="#{triStateCheckboxView.value3}" styleClass="custom-icons-tristate" itemLabel="Custom Icons"/>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
