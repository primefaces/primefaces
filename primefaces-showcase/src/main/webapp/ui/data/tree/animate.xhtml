<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        Tree <span class="subitem">Animate</span>
    </ui:define>

    <ui:define name="description">
        With <b>animate="true"</b> a slide effect is displayed when a node is expanded or collapsed.
    </ui:define>

    <ui:param name="documentationLink" value="/components/tree?id=vertial-tree"/>
    <ui:param name="componentLink" value="VerticalTree-1"/>
    <ui:param name="tagName" value="tree"/>

    <ui:define name="implementation">
        <div class="card">
            <h:form>
                <p:tree value="#{treeBasicView.root}" var="node" animate="true">
                    <p:treeNode>
                        <h:outputText value="#{node}"/>
                    </p:treeNode>
                </p:tree>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
