<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="head">
        <style>
            .cheap {
                background-color: #54a90a !important;
                background-image: none !important;
                color: #ffffff !important;
            }
        </style>
    </ui:define>

    <ui:define name="title">
        DataTable <span class="subitem">Row Style</span>
    </ui:define>

    <ui:define name="description">
        Certain rows can be styled with rowStyleClass and get a row-specific title with rowTitle, based on a condition.
        Table below highlights products that are cheaper than $50 and shows their price as title.
    </ui:define>

    <ui:param name="documentationLink" value="/components/datatable"/>
    <ui:param name="componentLink" value="DataTable-1"/>
    <ui:param name="tagName" value="dataTable"/>

    <ui:define name="implementation">
        <div class="card">
            <p:dataTable var="product" value="#{dtBasicView.products}"
                         rowStyleClass="#{product.price le 50.0 ? 'cheap' : null}"
                         rowTitle="#{product.price le 50.0 ? product.price : null}">

                <p:column headerText="Code">
                    <h:outputText value="#{product.code}" />
                </p:column>

                <p:column headerText="Name">
                    <h:outputText value="#{product.name}" />
                </p:column>

                <p:column headerText="Category">
                    <h:outputText value="#{product.category}" />
                </p:column>

                <p:column headerText="Quantity">
                    <h:outputText value="#{product.quantity}" />
                </p:column>
            </p:dataTable>
        </div>
    </ui:define>

</ui:composition>
