<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="head">
        <style>
            .top {
                filter: alpha(opacity=80);
                opacity: 0.8;
                padding: 50px 0 0 50px;
                z-index: 1000;
            }
        </style>

    </ui:define>

    <ui:define name="title">
        NotificationBar
    </ui:define>

    <ui:define name="description">
        NotificationBar is a panel with a fixed position at the top or the bottom of the page, so it does not scroll
        with the page. The example shows a bar at the top with the <b>slide</b> effect that is shown and hidden with
        the client side API.
    </ui:define>

    <ui:param name="documentationLink" value="/components/notificationbar"/>
    <ui:param name="componentLink" value="NotificationBar-1"/>
    <ui:param name="tagName" value="notificationBar"/>

    <ui:define name="implementation">

        <div class="card">
            <p:notificationBar position="top" effect="slide" styleClass="top" ref="bar">
                <h:outputText value="PrimeFaces Rocks!" style="font-size:36px;"/>
            </p:notificationBar>

            <p:commandButton value="Show" onclick="PF('bar').show()" type="button" icon="pi pi-arrow-down"/>
            <p:commandButton value="Hide" onclick="PF('bar').hide()" type="button" icon="pi pi-arrow-up"/>
        </div>

    </ui:define>

</ui:composition>
