<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        PhotoCam
    </ui:define>

    <ui:define name="description">
        PhotoCam is an input component to take photos with the webcam and send them to the backend model.
    </ui:define>

    <ui:param name="documentationLink" value="/components/photocam"/>
    <ui:param name="widgetLink" value="PhotoCam-1"/>
    <ui:param name="tagName" value="photocam"/>

    <ui:define name="implementation">
        <div class="card">
            <h:form>
                <div class="grid">
                    <div class="col-12 md:col-6">
                        <p:photoCam widgetVar="pc" listener="#{photoCamView.oncapture}" update="photo" styleClass="max-w-full"/>
                        <p:commandButton type="button" value="Capture" onclick="PF('pc').capture()" styleClass="mt-3"/>
                    </div>
                    <p:outputPanel id="photo" layout="block" styleClass="col-12 md:col-6">
                        <p:graphicImage name="demo/images/photocam/#{photoCamView.filename}.jpeg"
                                        rendered="#{not empty photoCamView.filename}" styleClass="max-w-full"/>
                    </p:outputPanel>
                </div>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
