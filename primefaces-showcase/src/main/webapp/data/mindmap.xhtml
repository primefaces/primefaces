<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        Mindmap
    </ui:define>

    <ui:define name="description">
        Mindmap is an interactive tool to visualize mindmap data. The children of a node are loaded lazily: a click on a
        node fires the <b>select</b> Ajax behavior event, and its listener adds the child nodes. A double click fires
        <b>dblselect</b>, which is used here to show the data of the node in a dialog.
    </ui:define>

    <ui:param name="documentationLink" value="/components/mindmap"/>
    <ui:param name="componentLink" value="Mindmap-1"/>
    <ui:param name="tagName" value="mindmap"/>

    <ui:define name="implementation">
        <div class="card">
            <h:form>
                <p:mindmap value="#{mindmapView.root}" style="width: 100%;height: 600px;border: 1px solid black;">
                    <p:ajax event="select" listener="#{mindmapView.onNodeSelect}"/>
                    <p:ajax event="dblselect" listener="#{mindmapView.onNodeDblselect}" update="output"
                            oncomplete="PF('details').show();"/>
                </p:mindmap>

                <p:dialog ref="details" header="Node Details" resizable="false" modal="true" showEffect="fade"
                          hideEffect="fade">
                    <h:outputText id="output" value="#{mindmapView.selectedNode.data}"/>
                </p:dialog>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
