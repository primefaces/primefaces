<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="head">
        <script src="https://maps.google.com/maps/api/js?key=AIzaSyCvCDkYieuUBmMWon_mfLAfjuaeuosuqow&amp;sensor=false"></script>
    </ui:define>

    <ui:define name="title">
        GMap <span class="subitem">Markers</span>
    </ui:define>

    <ui:define name="description">
        Markers are added to the map with the MapModel API. The Marker class has options such as a title text, a custom
        icon and dragging. This example shows two markers with the default pin, one with an image URL as icon and one
        with an SVG Symbol as icon.
    </ui:define>

    <ui:param name="documentationLink" value="/components/gmap"/>
    <ui:param name="componentLink" value="GMap-1"/>
    <ui:param name="tagName" value="gmap"/>

    <ui:define name="implementation">
        <div class="card">
            <p:gmap center="36.890257,30.707417" zoom="13" type="HYBRID" style="width:100%;height:400px"
                    model="#{markersView.simpleModel}"/>
        </div>
    </ui:define>

</ui:composition>
