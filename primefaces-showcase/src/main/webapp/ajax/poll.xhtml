<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        Ajax Framework <span class="subitem">Poll</span>
    </ui:define>

    <ui:define name="description">
        Poll sends Ajax requests periodically. Here it calls a <b>listener</b> every 2 seconds (<b>interval</b>) that
        increments a number and updates its output. <b>onactivated</b> is a client side callback that is executed when
        the poll is activated, here it writes to the browser console.
    </ui:define>

    <ui:param name="documentationLink" value="/components/poll"/>
    <ui:param name="componentLink" value="Poll-1"/>
    <ui:param name="tagName" value="ajax"/>

    <ui:define name="implementation">
        <div class="card">
            <h:form>
                <h1 class="text-center">
                    <h:outputText id="txt_count" value="#{pollView.number}"/>
                </h1>
                
                <p:poll interval="2" listener="#{pollView.increment}" update="txt_count" onactivated="console.log('Poll started')"/>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
