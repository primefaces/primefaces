<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        Text Editor
    </ui:define>

    <ui:define name="description">
        TextEditor is an input component for rich text, it is based on Quill. The second example defines its own toolbar
        in the <b>toolbar</b> facet, has a placeholder and is validated as required on save.
    </ui:define>

    <ui:param name="documentationLink" value="/components/texteditor"/>
    <ui:param name="componentLink" value="TextEditor-1"/>
    <ui:param name="tagName" value="textEditor"/>

    <ui:define name="implementation">
        <div class="card">
            <h:form>
                <h5 class="mt-0">Basic</h5>
                <p:textEditor ref="editor1" value="#{editorView.text}" height="300px" ariaLabel="Basic editor" />

                <h3 class="first">Custom Toolbar</h3>
                <p:textEditor ref="editor2" value="#{editorView.text2}" height="300px" placeholder="Enter your content" required="true" ariaLabel="Editor with custom toolbar">
                    <f:facet name="toolbar">
                     <span class="ql-formats">
                        <button class="ql-bold"></button>
                        <button class="ql-italic"></button>
                        <button class="ql-underline"></button>
                        <button class="ql-strike"></button>
                    </span>
                        <span class="ql-formats">
                        <select class="ql-font"></select>
                        <select class="ql-size"></select>
                    </span>
                    </f:facet>
                </p:textEditor>
                <p:commandButton value="Save" update="@form" icon="pi pi-check" styleClass="mt-2"/>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
