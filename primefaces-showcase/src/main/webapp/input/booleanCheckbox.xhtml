<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        SelectBooleanCheckbox
    </ui:define>

    <ui:define name="description">
        SelectBooleanCheckbox is used to select a boolean value with a checkbox, its label is set with <b>itemLabel</b>.
        The second example sends an Ajax request when the value changes and reports the new value in a message.
    </ui:define>

    <ui:param name="documentationLink" value="/components/selectbooleancheckbox"/>
    <ui:param name="componentLink" value="SelectBooleanCheckbox"/>
    <ui:param name="tagName" value="selectBooleanCheckbox"/>

    <ui:define name="implementation">
        <div class="card">
            <h:form>
                <p:growl id="msg"/>

                <h5 class="mt-0">Basic</h5>
                <p:selectBooleanCheckbox value="#{selectBooleanView.value1}" itemLabel="Basic"/>

                <h5>Remote</h5>
                <p:selectBooleanCheckbox value="#{selectBooleanView.value2}" itemLabel="Ajax">
                    <p:ajax update="msg" listener="#{selectBooleanView.addMessage}"/>
                </p:selectBooleanCheckbox>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
