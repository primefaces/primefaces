<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        ToggleSwitch
    </ui:define>

    <ui:define name="description">
        ToggleSwitch is used to select a boolean value with a switch. The examples show icons for the two states
        (<b>onIcon</b>, <b>offIcon</b>) and an Ajax request that reports the new value in a message.
    </ui:define>

    <ui:param name="documentationLink" value="/components/toggleswitch"/>
    <ui:param name="componentLink" value="ToggleSwitch"/>
    <ui:param name="tagName" value="toggleSwitch"/>

    <ui:define name="implementation">
        <div class="card">
            <h:form>
                <p:growl id="msg"/>

                <h5 class="mt-0">Basic</h5>
                <p:toggleSwitch value="#{selectBooleanView.value1}"/>
                
                <h5>Icon</h5>
                <p:toggleSwitch value="#{selectBooleanView.value2}" onIcon="pi pi-check" offIcon="pi pi-times" />

                <h5>Remote</h5>
                <p:toggleSwitch value="#{selectBooleanView.value3}">
                    <p:ajax listener="#{selectBooleanView.addMessage}" update="msg"/>
                </p:toggleSwitch>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
