<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:p="primefaces" template="/WEB-INF/template.xhtml">


    <ui:define name="title">
        Color Picker
    </ui:define>

    <ui:define name="description">
        With <b>mode="inline"</b> the ColorPicker is displayed in the page instead of a popup. Only one inline ColorPicker
        is possible per page, and inline and popup mode cannot be mixed on the same page.
    </ui:define>

    <ui:param name="documentationLink" value="/components/colorpicker" />
    <ui:param name="componentLink" value="ColorPicker-1" />
    <ui:param name="tagName" value="colorPicker"/>

    <ui:define name="implementation">
        <h:form>
            <div class="card">
                <p:growl>
                    <p:autoUpdate />
                </p:growl>

                <h5>Inline</h5>

                <p:colorPicker id="inline" mode="inline" value="#{colorView.ajax}"
                    formatToggle="true" theme="large">
                     <p:ajax event="change" listener="#{colorView.onColorChange}" />
                </p:colorPicker>
                
                <p:commandButton value="Save" update="@form" action="#{colorView.save}" icon="pi pi-check" styleClass="mt-4"/>
            </div>
        </h:form>
    </ui:define>

</ui:composition>
