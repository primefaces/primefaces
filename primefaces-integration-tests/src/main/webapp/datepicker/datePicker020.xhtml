<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <!-- GitHub #14137: a masked date picker must not fire a second change request on blur after a popup selection -->
            <p:datePicker id="date" value="#{datePicker020.date}" pattern="MM/dd/yyyy" mask="true" showIcon="true">
                <p:ajax process="@this" listener="#{datePicker020.onDateChange}" update="dateCount"/>
            </p:datePicker>
            <h:outputText id="dateCount" value="#{datePicker020.dateCount}"/>

            <p:datePicker id="dateForm" value="#{datePicker020.dateForm}" pattern="MM/dd/yyyy" mask="true" showIcon="true">
                <p:ajax process="@this" listener="#{datePicker020.onDateFormChange}" update="@form"/>
            </p:datePicker>
            <h:outputText id="dateFormCount" value="#{datePicker020.dateFormCount}"/>

            <p:selectOneMenu id="menu" value="#{datePicker020.item}">
                <f:selectItem itemLabel="Option 1" itemValue="1"/>
                <f:selectItem itemLabel="Option 2" itemValue="2"/>
                <f:selectItem itemLabel="Option 3" itemValue="3"/>
                <p:ajax process="@this" update="@this"/>
            </p:selectOneMenu>
        </h:form>

    </h:body>
</f:view>

</html>
