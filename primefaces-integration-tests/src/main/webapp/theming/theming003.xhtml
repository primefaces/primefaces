<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <f:event type="preRenderView" listener="#{theming003.addMessages}" />
    <h:head>
        <title>PrimeFaces Selenium - Theming</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <p:messages id="messages" closable="true" />

            <p:commandButton id="buttonPrimary" value="Primary" type="button" />

            <p:inputText id="inputText" />

            <p:dialog id="dialog" widgetVar="dialog" header="Dialog" visible="true" modal="false" closable="true">
                Dialog content
            </p:dialog>
        </h:form>
    </h:body>
</f:view>

</html>
