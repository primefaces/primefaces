<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>
        <title>PrimeFaces Selenium - Theming</title>
    </h:head>
    <h:body>
        <!-- keyboard focus (:focus-visible) of menu items, RTL -->
        <h:form id="form">
            <p:tabMenu id="tabMenu" activeIndex="0">
                <p:menuitem value="First" url="#" />
                <p:menuitem id="secondTab" value="Second" url="#" />
            </p:tabMenu>

            <p:panelMenu id="panelMenu">
                <p:submenu label="Submenu" expanded="true">
                    <p:menuitem id="panelMenuItem" value="Item" url="#" />
                </p:submenu>
            </p:panelMenu>

            <div dir="ltr">
                <p:toggleSwitch id="toggleLtr" value="#{theming009.checked}" />
            </div>
            <div dir="rtl">
                <p:toggleSwitch id="toggleRtl" value="#{theming009.checked}" />
            </div>
        </h:form>
    </h:body>
</f:view>

</html>
