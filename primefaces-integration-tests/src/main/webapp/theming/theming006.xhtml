<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>
        <title>PrimeFaces Selenium - Theming</title>
    </h:head>
    <h:body>
        <h:form id="form">
            <!-- the component renders the panel content: div.p-selectonemenu-items > ul.p-selectonemenu-list -->
            <p:selectOneMenu id="plain" ref="plain" value="#{theming006.plain}">
                <f:selectItem itemLabel="One" itemValue="One" />
                <f:selectItem itemLabel="Two" itemValue="Two" />
                <f:selectItem itemLabel="Three" itemValue="Three" />
            </p:selectOneMenu>

            <p:selectOneMenu id="grouped" ref="grouped" value="#{theming006.grouped}">
                <f:selectItems value="#{theming006.groups}" />
            </p:selectOneMenu>

            <p:selectOneMenu id="dynamic" ref="dynamic" value="#{theming006.dynamic}" dynamic="true">
                <f:selectItem itemLabel="One" itemValue="One" />
                <f:selectItem itemLabel="Two" itemValue="Two" />
                <f:selectItem itemLabel="Three" itemValue="Three" />
            </p:selectOneMenu>
        </h:form>
    </h:body>
</f:view>

</html>
