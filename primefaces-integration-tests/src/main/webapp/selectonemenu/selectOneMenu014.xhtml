<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core" xmlns:p="primefaces">
    <f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
        <h:head>

    </h:head>
        <h:body>
            <h:form id="form">
                <p:messages id="msgs" showDetail="true">
                    <p:autoUpdate/>
                </p:messages>

                <!-- GitHub #15221 / #15222: an item with an empty label must still be announced by a screen reader -->
                <p:selectOneMenu id="selectonemenu" value="#{selectOneMenu014.option}">
                    <f:selectItem itemLabel="" itemValue=""/>
                    <f:selectItem itemLabel="Ja" itemValue="true"/>
                    <f:selectItem itemLabel="Nein" itemValue="false"/>
                </p:selectOneMenu>

                <!-- same, but with a placeholder: the placeholder is the visible and announced text -->
                <p:selectOneMenu id="placeholder" value="#{selectOneMenu014.optionWithPlaceholder}" placeholder="Choose One">
                    <f:selectItem itemLabel="" itemValue=""/>
                    <f:selectItem itemLabel="Ja" itemValue="true"/>
                    <f:selectItem itemLabel="Nein" itemValue="false"/>
                </p:selectOneMenu>

                <!-- a label which only looks blank once it is escaped, e.g. a single space rendered as &amp;nbsp; -->
                <p:selectOneMenu id="blankLabel" value="#{selectOneMenu014.optionWithBlankLabel}">
                    <f:selectItem itemLabel=" " itemValue=""/>
                    <f:selectItem itemLabel="Ja" itemValue="true"/>
                    <f:selectItem itemLabel="Nein" itemValue="false"/>
                </p:selectOneMenu>

                <!-- empty label on a noSelectionOption item -->
                <p:selectOneMenu id="noSelection" value="#{selectOneMenu014.optionNoSelection}">
                    <f:selectItem itemLabel="" itemValue="" noSelectionOption="true"/>
                    <f:selectItem itemLabel="Ja" itemValue="true"/>
                    <f:selectItem itemLabel="Nein" itemValue="false"/>
                </p:selectOneMenu>

                <!-- same, but hideNoSelectionOption drops the item server-side, so it is never rendered -->
                <p:selectOneMenu id="hideNoSelection" value="#{selectOneMenu014.optionHideNoSelection}" hideNoSelectionOption="true">
                    <f:selectItem itemLabel="" itemValue="" noSelectionOption="true"/>
                    <f:selectItem itemLabel="Ja" itemValue="true"/>
                    <f:selectItem itemLabel="Nein" itemValue="false"/>
                </p:selectOneMenu>
            </h:form>
        </h:body>
    </f:view>
</html>
