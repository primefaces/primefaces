<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <p:messages id="msgs" />

            <p:selectOneMenu id="country" value="#{selectOneMenu018.country}" label="Country">
                <f:selectItem itemValue="#{null}" itemLabel="Select a country" />
                <f:selectItems value="#{selectOneMenu018.countries}" var="c" itemLabel="#{c}" itemValue="#{c}"
                               itemDisabled="#{selectOneMenu018.isDisabled(c)}" />
            </p:selectOneMenu>

            <p:selectOneMenu id="preset" value="#{selectOneMenu018.presetCountry}" label="Preset">
                <f:selectItems value="#{selectOneMenu018.countries}" var="c" itemLabel="#{c}" itemValue="#{c}"
                               itemDisabled="#{selectOneMenu018.isDisabled(c)}" />
            </p:selectOneMenu>

            <p:commandButton id="submit" value="Submit" process="@form" update="@form" />

            <h:outputText id="countryValue" value="#{selectOneMenu018.country}" />
            <h:outputText id="presetValue" value="#{selectOneMenu018.presetCountry}" />
        </h:form>

    </h:body>
</f:view>

</html>
