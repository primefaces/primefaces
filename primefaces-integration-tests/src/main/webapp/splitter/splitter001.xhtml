<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <p:messages id="msgs" showDetail="true"/>

            <p:splitter id="ajax" style="height: 200px; width: 600px">
                <p:ajax event="resizeEnd" listener="#{splitter001.onResizeEnd}" update="msgs"/>
                <p:splitterPanel>Panel 1</p:splitterPanel>
                <p:splitterPanel>Panel 2</p:splitterPanel>
            </p:splitter>

            <p:splitter id="keyboard" style="height: 200px; width: 600px">
                <p:splitterPanel size="30">Panel 1</p:splitterPanel>
                <p:splitterPanel size="70">Panel 2</p:splitterPanel>
            </p:splitter>
        </h:form>

    </h:body>
</f:view>

</html>
