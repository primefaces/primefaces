<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
	<h:head>

	</h:head>

	<h:body>

		<p:ajaxStatus id="ajaxStatus" delay="500" style="display:block; padding: 0">

			<f:facet name="default">
				<span id="defaultStatus">Default Displayed!</span>
			</f:facet>

			<f:facet name="start">
				<span id="startStatus">Start Facet!</span>
			</f:facet>

			<f:facet name="complete">
				<span id="completeStatus">Complete Facet!</span>
			</f:facet>

		</p:ajaxStatus>

		<!-- handle the error on the page, otherwise PrimeFaces navigates to the configured error page -->
		<p:ajaxExceptionHandler />

		<h:form id="form">
			<p:commandButton id="slowError" value="Slow Error" update="@form"
				action="#{ajaxStatus006.slowError}" />
			<p:commandButton id="fastError" value="Fast Error" update="@form"
				action="#{ajaxStatus006.fastError}" />
		</h:form>

	</h:body>
</f:view>

</html>
