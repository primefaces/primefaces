<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:h="jakarta.faces.html">

    <h:head>
        <style>
            /* the toggler icons are tokens: here for one table */
            .custom-icons-table {
                --p-datatable-row-toggle-collapsed-icon: var(--p-icon-plus);
                --p-datatable-row-toggle-expanded-icon: var(--p-icon-minus);
            }
        </style>
    </h:head>
    <h:body>
        <h:form id="form">
            <p:dataTable id="datatable" value="#{dataTable041.cars}" var="car" rowKey="#{car.number}" styleClass="custom-icons-table">
                <p:column style="width:2rem">
                    <p:rowToggler />
                </p:column>

                <p:column headerText="Car Name">
                    <h:outputText id="name" value="#{car.name}" />
                </p:column>

                <p:rowExpansion>
                    Price: #{car.price}
                </p:rowExpansion>
            </p:dataTable>
        </h:form>
    </h:body>
</html>
