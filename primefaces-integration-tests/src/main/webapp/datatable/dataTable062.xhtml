<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <p:dataTable id="datatable" value="#{dataTable062.progLanguages}" var="lang">
                <!-- the headerRow is not rendered initially, see GitHub #10481 -->
                <p:headerRow field="firstAppeared" rendered="#{dataTable062.grouped}">
                    <p:column colspan="4">
                        <h:outputText value="#{lang.firstAppeared}"/>
                    </p:column>
                </p:headerRow>

                <p:column field="id" headerText="ID"/>
                <p:column field="name" headerText="Name"/>
                <p:column field="firstAppeared" headerText="First appeared"/>
                <p:column field="type" headerText="Type"/>
            </p:dataTable>

            <p:commandButton id="toggle" value="Toggle grouping" action="#{dataTable062.toggleGrouped}" update="datatable"/>
        </h:form>

    </h:body>
</f:view>

</html>
