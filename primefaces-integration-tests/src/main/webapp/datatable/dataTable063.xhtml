<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:ui="jakarta.faces.facelets">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <!-- supported: header groups split into frozenHeader / scrollableHeader -->
            <p:dataTable id="split" value="#{dataTable063.progLanguages}" var="lang" frozenColumns="1" scrollable="true" scrollWidth="400">
                <p:columnGroup type="frozenHeader">
                    <p:row>
                        <p:column rowspan="3" headerText="ID"/>
                    </p:row>
                    <p:row/>
                    <p:row/>
                </p:columnGroup>
                <p:columnGroup type="scrollableHeader">
                    <p:row>
                        <p:column colspan="3" headerText="Language"/>
                    </p:row>
                    <p:row>
                        <p:column colspan="2" headerText="Info"/>
                        <p:column rowspan="2" headerText="Type"/>
                    </p:row>
                    <p:row>
                        <p:column headerText="Name"/>
                        <p:column headerText="First appeared"/>
                    </p:row>
                </p:columnGroup>

                <p:column><h:outputText value="#{lang.id}"/></p:column>
                <p:column><h:outputText value="#{lang.name}"/></p:column>
                <p:column><h:outputText value="#{lang.firstAppeared}"/></p:column>
                <p:column><h:outputText value="#{lang.type}"/></p:column>

                <p:columnGroup type="frozenFooter">
                    <p:row>
                        <p:column footerText="Total"/>
                    </p:row>
                </p:columnGroup>
                <p:columnGroup type="scrollableFooter">
                    <p:row>
                        <p:column colspan="3" footerText="5 languages"/>
                    </p:row>
                </p:columnGroup>
            </p:dataTable>

            <br/>

            <!-- GitHub #9854: plain header / footer groups get split between the frozen and the scrollable part -->
            <p:dataTable id="single" value="#{dataTable063.progLanguages}" var="lang" frozenColumns="1" scrollable="true" scrollWidth="400">
                <p:columnGroup type="header">
                    <p:row>
                        <p:column rowspan="3" headerText="ID"/>
                        <p:column colspan="3" headerText="Language"/>
                    </p:row>
                    <p:row>
                        <p:column colspan="2" headerText="Info"/>
                        <p:column rowspan="2" headerText="Type"/>
                    </p:row>
                    <p:row>
                        <p:column headerText="Name" sortBy="#{lang.name}"/>
                        <p:column headerText="First appeared"/>
                    </p:row>
                </p:columnGroup>

                <p:column><h:outputText value="#{lang.id}"/></p:column>
                <p:column><h:outputText value="#{lang.name}"/></p:column>
                <p:column><h:outputText value="#{lang.firstAppeared}"/></p:column>
                <p:column><h:outputText value="#{lang.type}"/></p:column>

                <p:columnGroup type="footer">
                    <p:row>
                        <p:column footerText="Total"/>
                        <p:column colspan="3" footerText="5 languages"/>
                    </p:row>
                </p:columnGroup>
            </p:dataTable>

            <br/>

            <!-- GitHub #9854: a cell spanning both parts is encoded where it starts, the other part gets an empty cell -->
            <p:dataTable id="straddle" value="#{dataTable063.progLanguages}" var="lang" frozenColumns="2" scrollable="true" scrollWidth="400">
                <p:columnGroup type="header">
                    <p:row>
                        <p:column rowspan="3" headerText="ID"/>
                        <p:column colspan="3" headerText="Language"/>
                    </p:row>
                    <p:row>
                        <p:column colspan="2" headerText="Info"/>
                        <p:column rowspan="2" headerText="Type"/>
                    </p:row>
                    <p:row>
                        <p:column headerText="Name" sortBy="#{lang.name}"/>
                        <p:column headerText="First appeared"/>
                    </p:row>
                </p:columnGroup>

                <p:column><h:outputText value="#{lang.id}"/></p:column>
                <p:column><h:outputText value="#{lang.name}"/></p:column>
                <p:column><h:outputText value="#{lang.firstAppeared}"/></p:column>
                <p:column><h:outputText value="#{lang.type}"/></p:column>

                <p:columnGroup type="footer">
                    <p:row>
                        <p:column footerText="Total"/>
                        <p:column colspan="3" footerText="5 languages"/>
                    </p:row>
                </p:columnGroup>
            </p:dataTable>

            <br/>

            <!-- GitHub #9854: frozen columns aligned right -->
            <p:dataTable id="right" value="#{dataTable063.progLanguages}" var="lang" frozenColumns="1" frozenColumnsAlignment="right"
                         scrollable="true" scrollWidth="400">
                <p:columnGroup type="header">
                    <p:row>
                        <p:column rowspan="3" headerText="ID"/>
                        <p:column colspan="3" headerText="Language"/>
                    </p:row>
                    <p:row>
                        <p:column colspan="2" headerText="Info"/>
                        <p:column rowspan="2" headerText="Type"/>
                    </p:row>
                    <p:row>
                        <p:column headerText="Name"/>
                        <p:column headerText="First appeared"/>
                    </p:row>
                </p:columnGroup>

                <p:column><h:outputText value="#{lang.id}"/></p:column>
                <p:column><h:outputText value="#{lang.name}"/></p:column>
                <p:column><h:outputText value="#{lang.firstAppeared}"/></p:column>
                <p:column><h:outputText value="#{lang.type}"/></p:column>

                <p:columnGroup type="footer">
                    <p:row>
                        <p:column footerText="Total"/>
                        <p:column colspan="3" footerText="5 languages"/>
                    </p:row>
                </p:columnGroup>
            </p:dataTable>

            <br/>

            <!-- GitHub #9854: columns wrapped in ui:fragment and ui:repeat -->
            <p:dataTable id="wrapped" value="#{dataTable063.progLanguages}" var="lang" frozenColumns="1" scrollable="true" scrollWidth="400">
                <p:columnGroup type="header">
                    <p:row>
                        <ui:fragment>
                            <p:column id="idColumn" rowspan="3" headerText="ID"/>
                            <p:tooltip id="idTooltip" for="idColumn" value="Identifier"/>
                        </ui:fragment>
                        <h:inputHidden id="note" value="note"/>
                        <p:column colspan="3" headerText="Language"/>
                    </p:row>
                    <p:row>
                        <p:column colspan="2" headerText="Info"/>
                        <p:column rowspan="2" headerText="Type"/>
                    </p:row>
                    <p:row>
                        <ui:repeat value="#{dataTable063.infoColumns}" var="info">
                            <p:column headerText="#{info}"/>
                        </ui:repeat>
                    </p:row>
                </p:columnGroup>

                <p:column><h:outputText value="#{lang.id}"/></p:column>
                <p:column><h:outputText value="#{lang.name}"/></p:column>
                <p:column><h:outputText value="#{lang.firstAppeared}"/></p:column>
                <p:column><h:outputText value="#{lang.type}"/></p:column>
            </p:dataTable>

            <br/>

            <!-- GitHub #9854: p:columns in the column group -->
            <p:dataTable id="dynamic" value="#{dataTable063.progLanguages}" var="lang" frozenColumns="1" scrollable="true" scrollWidth="400">
                <p:columnGroup type="header">
                    <p:row>
                        <p:column rowspan="3" headerText="ID"/>
                        <p:column colspan="3" headerText="Language"/>
                    </p:row>
                    <p:row>
                        <p:column colspan="2" headerText="Info"/>
                        <p:column rowspan="2" headerText="Type"/>
                    </p:row>
                    <p:row>
                        <p:columns value="#{dataTable063.infoColumns}" var="info" headerText="#{info}"/>
                    </p:row>
                </p:columnGroup>

                <p:column><h:outputText value="#{lang.id}"/></p:column>
                <p:column><h:outputText value="#{lang.name}"/></p:column>
                <p:column><h:outputText value="#{lang.firstAppeared}"/></p:column>
                <p:column><h:outputText value="#{lang.type}"/></p:column>
            </p:dataTable>

            <br/>

            <!-- GitHub #9854: a cell spanning both parts and two rows; its width is meant for both of its columns -->
            <p:dataTable id="spanning" value="#{dataTable063.progLanguages}" var="lang" frozenColumns="2" scrollable="true" scrollWidth="400">
                <p:columnGroup type="header">
                    <p:row>
                        <p:column headerText="ID"/>
                        <p:column colspan="2" rowspan="2" headerText="Language" width="300" style="width:300px"/>
                        <p:column rowspan="3" headerText="Type"/>
                    </p:row>
                    <p:row>
                        <p:column headerText="#"/>
                    </p:row>
                    <p:row>
                        <p:column headerText="Key"/>
                        <p:column headerText="Name"/>
                        <p:column headerText="First appeared"/>
                    </p:row>
                </p:columnGroup>

                <p:column><h:outputText value="#{lang.id}"/></p:column>
                <p:column><h:outputText value="#{lang.name}"/></p:column>
                <p:column><h:outputText value="#{lang.firstAppeared}"/></p:column>
                <p:column><h:outputText value="#{lang.type}"/></p:column>
            </p:dataTable>

            <br/>

            <!-- GitHub #9854: with one dedicated group the plain group is not split, the other part keeps its per column headers -->
            <p:dataTable id="mixed" value="#{dataTable063.progLanguages}" var="lang" frozenColumns="1" scrollable="true" scrollWidth="400">
                <p:columnGroup type="frozenHeader">
                    <p:row>
                        <p:column headerText="Key"/>
                    </p:row>
                </p:columnGroup>
                <p:columnGroup type="header">
                    <p:row>
                        <p:column headerText="ID"/>
                        <p:column colspan="3" headerText="Language"/>
                    </p:row>
                </p:columnGroup>

                <p:column headerText="ID"><h:outputText value="#{lang.id}"/></p:column>
                <p:column headerText="Name"><h:outputText value="#{lang.name}"/></p:column>
                <p:column headerText="First appeared"><h:outputText value="#{lang.firstAppeared}"/></p:column>
                <p:column headerText="Type"><h:outputText value="#{lang.type}"/></p:column>
            </p:dataTable>

            <br/>

            <!-- GitHub #9854: a frozen table nested in a header cell must not clear the split state of the outer table -->
            <p:dataTable id="nested" value="#{dataTable063.progLanguages}" var="lang" frozenColumns="1" scrollable="true" scrollWidth="400">
                <p:columnGroup type="header">
                    <p:row>
                        <p:column>
                            <f:facet name="header">
                                <p:dataTable id="inner" value="#{dataTable063.progLanguages}" var="innerLang" frozenColumns="1"
                                             scrollable="true" scrollWidth="150">
                                    <p:columnGroup type="header">
                                        <p:row>
                                            <p:column headerText="A"/>
                                            <p:column headerText="B"/>
                                        </p:row>
                                    </p:columnGroup>
                                    <p:column><h:outputText value="#{innerLang.id}"/></p:column>
                                    <p:column><h:outputText value="#{innerLang.name}"/></p:column>
                                </p:dataTable>
                            </f:facet>
                        </p:column>
                        <p:column colspan="3" headerText="Language"/>
                    </p:row>
                </p:columnGroup>

                <p:column><h:outputText value="#{lang.id}"/></p:column>
                <p:column><h:outputText value="#{lang.name}"/></p:column>
                <p:column><h:outputText value="#{lang.firstAppeared}"/></p:column>
                <p:column><h:outputText value="#{lang.type}"/></p:column>
            </p:dataTable>

        </h:form>

    </h:body>
</f:view>

</html>
