<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <p:messages id="msgs" showDetail="true">
                <p:autoUpdate/>
            </p:messages>

            <p:dataTable id="datatable" widgetVar="datatable" value="#{dataTable053.langs}" var="lang">
                <p:column field="id" headerText="ID"/>

                <p:column field="name" headerText="Name"/>

                <p:column field="type" headerText="Type" filterMatchMode="in">
                    <f:facet name="filter">
                        <p:selectCheckboxMenu id="filterType" multiple="true" updateLabel="true"
                                              value="#{dataTable053.selectedTypes}">
                            <f:selectItem itemLabel="No Type" itemValue="#{null}"/>
                            <f:selectItems value="#{dataTable053.types}"/>
                        </p:selectCheckboxMenu>
                    </f:facet>
                </p:column>
            </p:dataTable>

            <p:commandButton id="buttonUpdate" value="Update" update="datatable"/>
            <p:commandButton id="buttonShowFilter" value="Show Filter" update="@form"
                             action="#{dataTable053.showFilter}"/>
        </h:form>

    </h:body>
</f:view>

</html>
