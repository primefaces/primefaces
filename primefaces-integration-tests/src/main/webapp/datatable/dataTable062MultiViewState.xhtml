<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <f:metadata>
        <f:viewParam name="mode" value="#{dataTable062.mode}"/>
    </f:metadata>

    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <!-- the headerRows are switched by their rendered attribute, see GitHub #10481 -->
            <p:dataTable id="datatable" value="#{dataTable062.progLanguages}" var="lang" multiViewState="true">
                <p:headerRow field="firstAppeared" rendered="#{dataTable062.mode eq 'year'}">
                    <p:column colspan="4">
                        <h:outputText value="#{lang.firstAppeared}"/>
                    </p:column>
                </p:headerRow>

                <p:headerRow field="type" rendered="#{dataTable062.mode eq 'type'}">
                    <p:column colspan="4">
                        <h:outputText value="#{lang.type}"/>
                    </p:column>
                </p:headerRow>

                <p:column field="id" headerText="ID"/>
                <p:column field="name" headerText="Name"/>
                <p:column field="firstAppeared" headerText="First appeared"/>
                <p:column field="type" headerText="Type"/>
            </p:dataTable>

            <p:commandButton id="none" value="No grouping" update="@form">
                <f:setPropertyActionListener target="#{dataTable062.mode}" value="none"/>
            </p:commandButton>
            <p:commandButton id="type" value="Group by type" update="@form">
                <f:setPropertyActionListener target="#{dataTable062.mode}" value="type"/>
            </p:commandButton>
            <p:commandButton id="clearTableState" value="Clear table state" action="#{dataTable062.clearTableState}" update="@form"/>
        </h:form>

    </h:body>
</f:view>

</html>
