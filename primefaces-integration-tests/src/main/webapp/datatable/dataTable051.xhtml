<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <style>
                td, th { white-space: nowrap; font-size: .75rem; }
            </style>

            <p:dataTable id="datatable" widgetVar="wgtTable" value="#{dataTable051.employees}" var="employee"
                         filteredValue="#{dataTable051.filteredEmployees}" filterEvent="enter">

                <!-- narrow, fixed-width column (p:dataTable defaults to table-layout: fixed) mirrors the
                     showcase "Activity" column that exposed: the filter match-mode <select>
                     and value <input> must both stay usable side by side even when space is tight. -->
                <p:column headerText="ID" field="id" filterMatchMode="gt" filterMatchModeOptions="numeric"
                          converter="jakarta.faces.Integer" style="width:120px"/>

                <p:column headerText="last name" field="lastName" filterMatchMode="contains" filterMatchModeOptions="text"/>

                <!-- nullable field (Alfred Paul + the two synthetic rows have no salary) so "is (not) null" is
                     distinguishable from "(not) between"/"(not) in list" -->
                <p:column headerText="salary" field="salary" filterMatchMode="gt" filterMatchModeOptions="numeric"
                          converter="jakarta.faces.Integer"/>

                <!-- every mode in the "boolean" preset is value-less (true/false/is null/is not null) -->
                <p:column headerText="active" field="active" filterMatchModeOptions="boolean"/>

                <!-- explicit fixed-pattern converter (not the locale-dependent default) so filter values typed
                     as free text parse unambiguously -->
                <p:column headerText="review date" field="reviewDate" filterMatchMode="equals" filterMatchModeOptions="date"
                          converter="#{dataTable051.reviewDateConverter}"/>

                <!-- bare time-of-day value (LocalTime, no date component) - "time" drops every day/week/month/...
                     predicate the "date" preset has and adds last/next N minutes/hours instead -->
                <p:column headerText="check-in time" field="checkInTime" filterMatchMode="equals" filterMatchModeOptions="time"
                          converter="#{dataTable051.checkInTimeConverter}"/>

                <!-- full date+time value (LocalDateTime) - "datetime" is every "date" mode plus last/next N
                     minutes/hours for time-of-day precision -->
                <p:column headerText="last login" field="lastLoginDateTime" filterMatchMode="equals" filterMatchModeOptions="datetime"
                          converter="#{dataTable051.lastLoginDateTimeConverter}"/>

                <!-- plain Java enum (Employee.Role) - no converter needed: EqualsFilterConstraint already
                     special-cases enum-versus-typed-string comparison via toString() -->
                <p:column headerText="role" field="role" filterMatchMode="equals" filterMatchModeOptions="enum"/>

                <!-- multivalued field (List<String>) - "array": contains/does not contain (single value),
                     contains any/all/none (comma-separated list), is (not) empty -->
                <p:column headerText="skills" field="skills" filterMatchMode="arrayContains" filterMatchModeOptions="array"/>

            </p:dataTable>

            <p:commandButton id="buttonUpdate" value="Update" update="datatable"/>
        </h:form>

    </h:body>
</f:view>

</html>
