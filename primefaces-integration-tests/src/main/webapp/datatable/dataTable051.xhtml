<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <style>
                td, th { white-space: nowrap; font-size: .75rem; }
            </style>

            <p:dataTable id="datatable" widgetVar="wgtTable" value="#{dataTable051.employees}" var="employee"
                         filteredValue="#{dataTable051.filteredEmployees}" filterEvent="enter">

                <!-- narrow, fixed-width column (p:dataTable defaults to table-layout: fixed) mirrors the
                     showcase "Activity" column that exposed GitHub #7427: the filter match-mode <select>
                     and value <input> must both stay usable side by side even when space is tight. -->
                <p:column headerText="ID" field="id" filterMatchMode="gt" filterMatchModeOptions="numeric"
                          converter="jakarta.faces.Integer" style="width:120px"/>

                <p:column headerText="last name" field="lastName" filterMatchMode="contains" filterMatchModeOptions="text"/>

            </p:dataTable>

            <p:commandButton id="buttonUpdate" value="Update" update="datatable"/>
        </h:form>

    </h:body>
</f:view>

</html>
