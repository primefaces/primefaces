<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <p:messages id="msgs" showDetail="true"/>
            <h:outputText id="layout" value="#{dashboard002.layout}"/>

            <p:dashboard id="dashboard" model="#{dashboard002.model}" responsive="true" style="width: 400px">
                <p:ajax event="reorder" listener="#{dashboard002.onReorder}" update="msgs layout"/>

                <p:panel id="bar" header="Bar">Bar content</p:panel>
                <p:panel id="pie" header="Pie">Pie content</p:panel>
                <p:panel id="line" header="Line">Line content</p:panel>
            </p:dashboard>

            <p:commandButton id="update" value="Update" update="dashboard layout"/>
        </h:form>

    </h:body>
</f:view>

</html>
