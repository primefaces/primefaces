<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <p:imageSwitch id="manual" effect="fade" speed="100" slideshowAuto="false">
                <p:graphicImage name="imageswitch/bamboo-watch.jpg" alt="Bamboo Watch" width="300" height="200"/>
                <p:graphicImage name="imageswitch/black-watch.jpg" alt="Black Watch" width="300" height="200"/>
                <p:graphicImage name="imageswitch/blue-t-shirt.jpg" alt="Blue T-Shirt" width="300" height="200"/>
            </p:imageSwitch>

            <p:imageSwitch id="slideshow" effect="fade" speed="100" slideshowSpeed="500">
                <p:graphicImage name="imageswitch/bamboo-watch.jpg" alt="Bamboo Watch" width="300" height="200"/>
                <p:graphicImage name="imageswitch/black-watch.jpg" alt="Black Watch" width="300" height="200"/>
                <p:graphicImage name="imageswitch/blue-t-shirt.jpg" alt="Blue T-Shirt" width="300" height="200"/>
            </p:imageSwitch>
        </h:form>

    </h:body>
</f:view>

</html>
