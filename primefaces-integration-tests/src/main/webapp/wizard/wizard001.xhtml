<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html" xmlns:p="primefaces">
    <h:head />
    <h:body>
        <h:form id="form">
            <p:wizard id="wizard" widgetVar="wizard" highlightCompletedSteps="#{wizard001.highlight}"
                      step="#{wizard001.step}" showStepStatus="#{wizard001.status}"
                      onnext="return !#{wizard001.blockNext}" onback="return !#{wizard001.blockBack}"
                      effect="#{wizard001.effect}" effectDuration="100">
                <p:tab id="first" title="First"><p:inputText id="value" value="#{wizard001.value}" required="#{wizard001.required}" /></p:tab>
                <p:tab id="hidden" title="Hidden" rendered="false" />
                <p:tab id="second" title="Second"><h:outputText value="Second step" /></p:tab>
                <p:tab id="third" title="Third" titleStyleClass="#{wizard001.custom ? 'p-state-highlight custom' : ''}"><h:outputText value="Third step" /></p:tab>
            </p:wizard>
            <p:commandButton id="refresh" value="Refresh" update="wizard" />
        </h:form>
    </h:body>
</html>
