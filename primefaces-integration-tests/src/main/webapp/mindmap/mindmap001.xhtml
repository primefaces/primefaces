<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <p:messages id="msgs" showDetail="true"/>

            <p:mindmap id="mindmap" widgetVar="mindmap" value="#{mindmap001.root}" effectSpeed="0" style="width: 600px; height: 400px;">
                <p:ajax event="select" listener="#{mindmap001.onSelect}" update="form:msgs"/>
                <p:ajax event="dblselect" listener="#{mindmap001.onDblselect}" update="form:msgs"/>
            </p:mindmap>
        </h:form>

    </h:body>
</f:view>

</html>
