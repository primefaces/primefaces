<!DOCTYPE html>
<html xmlns:h="jakarta.faces.html"
      xmlns:p="primefaces">

    <h:head>
        <title>coreAjax002</title>
    </h:head>

    <h:body>
        <h:form id="form1">
            <p:commandButton id="button" value="UICommand with literal oncomplete"
                oncomplete="$('#output1').append('literal');" />
            <span id="output1"></span>
        </h:form>

        <h:form id="form2">
            <p:commandButton id="button" value="UICommand with partial EL oncomplete"
                action="#{coreAjax002.modifyProperty}"
                oncomplete="$('#output2').append('#{coreAjax002.property}');" />
            <span id="output2"></span>
        </h:form>

        <h:form id="form3">
            <p:commandButton id="button" value="UICommand with full EL oncomplete"
                action="#{coreAjax002.fullOncomplete3}"
                oncomplete="#{coreAjax002.oncomplete}" />
            <span id="output3"></span>
        </h:form>

        <h:form id="form4">
            <p:commandButton id="button" value="AjaxBehavior with literal oncomplete">
                <p:ajax 
                    oncomplete="$('#output4').append('literal');" />
            </p:commandButton>
            <span id="output4"></span>
        </h:form>

        <h:form id="form5">
            <p:commandButton id="button" value="AjaxBehavior with partial EL oncomplete">
                <p:ajax 
                    listener="#{coreAjax002.modifyProperty}"
                    oncomplete="$('#output5').append('#{coreAjax002.property}')" />
            </p:commandButton>
            <span id="output5"></span>
        </h:form>

        <h:form id="form6">
            <p:commandButton id="button" value="AjaxBehavior with full EL oncomplete">
                <p:ajax 
                    listener="#{coreAjax002.fullOncomplete6}"
                    oncomplete="#{coreAjax002.oncomplete}" />
            </p:commandButton>
            <span id="output6"></span>
        </h:form>

        <h:form id="form7">
            <p:commandButton id="button" value="Assert literal oncomplete arguments and window context"
                action="#{coreAjax002.addCallbackParam}"
                oncomplete="$('#output7').append('literal ' + xhr.readyState + ' ' + status + ' ' + args.param + ' ' + !!data + ' ' + !!window + ' ' + !!PrimeFaces + ' ' + !!PF)" />
            <span id="output7"></span>
        </h:form>

        <h:form id="form8">
            <p:commandButton id="button" value="Assert dynamic oncomplete arguments and window context"
                actionListener="#{coreAjax002.modifyProperty}"
                action="#{coreAjax002.addCallbackParam}"
                oncomplete="$('#output8').append(`#{coreAjax002.property} \${xhr.readyState} \${status} \${args.param} \${!!data} \${!!window} \${!!PrimeFaces} \${!!PF}`)" />
            <span id="output8"></span>
        </h:form>

        <h:form id="form9">
            <p:remoteCommand name="remoteCommand9"
                action="#{coreAjax002.modifyProperty}"
                oncomplete="$('#output9').append('literal'); $('#output9').append(' #{coreAjax002.property}');" />
            <span id="output9"></span>
        </h:form>

        <h:form id="form10">
            <p:remoteCommand name="remoteCommand10"
                action="#{coreAjax002.fullOncomplete10}"
                oncomplete="#{coreAjax002.oncomplete}" />
            <span id="output10"></span>
        </h:form>

        <h:form id="form11">
            <p:inputText id="input" required="true" />
            <p:commandButton id="button" value="UICommand with partial EL oncomplete and failed validation" process="@form"
                action="#{coreAjax002.modifyProperty}"
                oncomplete="$('#output11').append('#{coreAjax002.property} ' + args.validationFailed);" />
            <span id="output11"></span>
        </h:form>

        <h:form id="form12">
            <p:inputText id="input" required="true" />
            <p:commandButton id="button" value="AjaxBehavior with partial EL oncomplete and failed validation">
                <p:ajax process="@form"
                    listener="#{coreAjax002.modifyProperty}"
                    oncomplete="$('#output12').append('#{coreAjax002.property} ' + args.validationFailed);" />
            </p:commandButton>
            <span id="output12"></span>
        </h:form>

        <h:form id="form13">
            <p:inputText id="input" required="true" />
            <p:dataTable id="table" value="#{coreAjax002.items}" var="item">
                <p:column>
                    <p:commandButton id="button" value="UICommand in row with partial EL oncomplete and failed validation" process="@form"
                        oncomplete="$('#output13').append('#{item} ' + args.validationFailed);" />
                </p:column>
            </p:dataTable>
            <span id="output13"></span>
        </h:form>

        <h:form id="form14">
            <p:dataTable id="table" value="#{coreAjax002.items}" var="item" rowKey="#{item}"
                selectionMode="single" selection="#{coreAjax002.selectedItem}">
                <p:ajax event="rowSelect"
                    listener="#{coreAjax002.modifyProperty}"
                    oncomplete="$('#output14').append('#{coreAjax002.property}');" />
                <p:column>#{item}</p:column>
            </p:dataTable>
            <span id="output14"></span>
        </h:form>

        <h:form id="form15">
            <p:dataTable id="table" value="#{coreAjax002.items}" var="item">
                <p:ajax event="filter"
                    listener="#{coreAjax002.modifyProperty}"
                    oncomplete="$('#output15').append('#{coreAjax002.property}');" />
                <p:column headerText="Item" filterBy="#{item}">#{item}</p:column>
            </p:dataTable>
            <span id="output15"></span>
        </h:form>

        <h:form id="form16">
            <p:progressBar id="progressBar" ajax="true" interval="200" value="#{coreAjax002.progress}" global="false">
                <p:ajax event="complete"
                    listener="#{coreAjax002.modifyProperty}"
                    oncomplete="$('#output16').append('#{coreAjax002.property}');" />
            </p:progressBar>
            <span id="output16"></span>
        </h:form>
    </h:body>
</html>
