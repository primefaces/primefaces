<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <p:commandButton id="btnUpdate" value="Update" process="@this" update="wrapper"/>
            <p:commandButton id="btnToggle" value="Toggle" process="@this" update="wrapper" action="#{coreWidget001.toggle}"/>

            <h:panelGroup id="wrapper" layout="block">
                <h:panelGroup id="container" layout="block" rendered="#{coreWidget001.rendered}">
                    <p:orderList id="orderList" value="#{coreWidget001.orderList}" var="item" itemValue="#{item}" itemLabel="#{item}"
                                 controlsLocation="none"/>

                    <p:pickList id="pickList" value="#{coreWidget001.pickList}" var="item" itemValue="#{item}" itemLabel="#{item}"/>

                    <p:dataTable id="dataTable" value="#{coreWidget001.rows}" var="row" draggableRows="true" draggableColumns="true"
                                 resizableColumns="true" style="width: 400px">
                        <p:column headerText="Name">#{row}</p:column>
                        <p:column headerText="Length">#{row.length()}</p:column>
                    </p:dataTable>

                    <p:tree id="tree" value="#{coreWidget001.root}" var="node" draggable="true" droppable="true">
                        <p:treeNode>#{node}</p:treeNode>
                    </p:tree>

                    <p:dashboard id="dashboard" model="#{coreWidget001.dashboard}">
                        <p:panel id="panel1" header="Panel 1">1</p:panel>
                        <p:panel id="panel2" header="Panel 2">2</p:panel>
                        <p:panel id="panel3" header="Panel 3">3</p:panel>
                    </p:dashboard>

                    <p:panel id="dragPanel" header="Drag me" style="width: 150px"/>
                    <p:draggable id="drag" for="dragPanel"/>

                    <p:outputPanel id="dropArea" layout="block" style="width: 200px; height: 60px; border: 1px solid">Drop here</p:outputPanel>
                    <p:droppable id="drop" for="dropArea"/>

                    <h:panelGroup id="resizeBox" layout="block" style="width: 100px; height: 50px; border: 1px solid"/>
                    <p:resizable id="resize" for="resizeBox"/>

                    <p:dialog id="dlg" header="Dialog" visible="true" draggable="true" resizable="true" width="200"
                              position="center">
                        Content
                    </p:dialog>
                </h:panelGroup>
            </h:panelGroup>
        </h:form>

    </h:body>
</f:view>

</html>
