<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form" enctype="multipart/form-data">

            <h:outputText id="scriptResult" value="" />

            <p:fileUpload id="simple"
                          mode="simple" skinSimple="true" auto="true"
                          process="@this"
                          listener="#{fileUploadHandler.handleFileUploadWithScript}" />

            <p:fileUpload id="advanced"
                          mode="advanced" dragDrop="false" auto="true"
                          process="@this"
                          listener="#{fileUploadHandler.handleFileUploadWithScript}" />

        </h:form>

    </h:body>
</f:view>

</html>
