<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <p:messages id="msgs" showDetail="true"/>

            <p:inputOtp id="otp" value="#{inputOtp001.code}" label="OTP" integerOnly="true"/>
            <h:outputText id="code" value="#{inputOtp001.code}"/>

            <p:inputOtp id="masked" value="#{inputOtp001.pin}" mask="true"/>
            <p:inputOtp id="redisplay" value="#{inputOtp001.pin}" mask="true" redisplay="true"/>

            <p:commandButton id="button" value="Submit" update="@form"/>
        </h:form>

    </h:body>
</f:view>

</html>
