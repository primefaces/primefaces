<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <!-- deprecated activeIndex bound to an int property -->
            <p:tabView id="activeIndexBinding" activeIndex="#{tabView008.activeIndex}">
                <p:tab title="Tab 1">Dummy-Content 1</p:tab>
                <p:tab title="Tab 2">Dummy-Content 2</p:tab>
                <p:tab title="Tab 3">Dummy-Content 3</p:tab>
            </p:tabView>
            <h:outputText id="activeIndexValue" value="#{tabView008.activeIndex}"/>

            <!-- active bound to an int property, the tabs define keys -->
            <p:tabView id="activeBinding" active="#{tabView008.active}">
                <p:tab key="tab1" title="Tab 1">Dummy-Content 1</p:tab>
                <p:tab key="tab2" title="Tab 2">Dummy-Content 2</p:tab>
                <p:tab key="tab3" title="Tab 3">Dummy-Content 3</p:tab>
            </p:tabView>
            <h:outputText id="activeValue" value="#{tabView008.active}"/>

            <!-- active tab changed from Java via setActiveIndex -->
            <p:tabView id="programmatic">
                <p:tab title="Tab 1">Dummy-Content 1</p:tab>
                <p:tab title="Tab 2">Dummy-Content 2</p:tab>
                <p:tab title="Tab 3">Dummy-Content 3</p:tab>
            </p:tabView>

            <p:commandButton id="submit" value="Submit" update="@form"/>
            <p:commandButton id="selectLast" value="Select last tab" actionListener="#{tabView008.selectLastTab}" update="@form"/>
        </h:form>

    </h:body>
</f:view>

</html>
