<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core" xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <!-- GitHub https://github.com/primefaces/primefaces/issues/15304 -->
            <p:autoComplete id="autocomplete"
                            forceSelection="true"
                            value="#{autoComplete009.text}"
                            completeMethod="#{autoComplete009.completeText}"
                            dropdown="true">
                <p:ajax update="submittedValues" />
            </p:autoComplete>
            <p:commandButton id="button" value="Submit" process="@form" update="@form" actionListener="#{autoComplete009.submit}" />
            <h:outputText id="submittedValues" value="#{autoComplete009.submittedValues}" />
        </h:form>

    </h:body>
</f:view>

</html>
