<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core" xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <!-- GitHub https://github.com/primefaces/primefaces/issues/15270 -->
            <p:autoComplete id="autocomplete"
                            value="#{autoComplete008.driver}"
                            converter="generatedDriverConverter"
                            completeMethod="#{autoComplete008.completeText}"
                            var="driver"
                            itemLabel="#{driver.name}"
                            itemValue="#{driver}"
                            minQueryLength="1"
                            queryDelay="10"
                            maxResults="3"
                            moreText="More results available"
                            autoHighlight="false">
                <p:column>#{driver.id}</p:column>
                <p:column>#{driver.name}</p:column>
            </p:autoComplete>
        </h:form>

    </h:body>
</f:view>

</html>
