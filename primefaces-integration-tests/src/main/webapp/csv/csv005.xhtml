<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
    <h:head>

    </h:head>

    <h:body>

        <h:form id="form">
            <p:messages id="messages"/>

            <h:panelGrid columns="4" cellpadding="5">
                <p:outputLabel for="otp" value="OTP"/>
                <p:inputOtp id="otp" value="#{csv005.otp}" label="OTP" integerOnly="true" required="true">
                    <p:clientValidator/>
                </p:inputOtp>
                <p:message for="otp" id="msgOtp"/>
                <h:outputText id="otpValue" value="#{csv005.otp}"/>

                <p:outputLabel for="phone" value="Phone"/>
                <p:inputPhone id="phone" value="#{csv005.phone}" label="Phone" initialCountry="DE" required="true">
                    <p:clientValidator event="change"/>
                </p:inputPhone>
                <p:message for="phone" id="msgPhone"/>
                <h:outputText id="phoneValue" value="#{csv005.phone}"/>

                <!-- without label (also not by p:outputLabel): the message names the component, not its hidden input -->
                <h:outputText value="Number"/>
                <p:inputNumber id="number" value="#{csv005.number}" required="true"/>
                <p:message for="number" id="msgNumber"/>
                <h:outputText id="numberValue" value="#{csv005.number}"/>
            </h:panelGrid>

            <p:commandButton id="btnAjax" value="Ajax" update="@form" validateClient="true"/>
        </h:form>

    </h:body>
</f:view>

</html>
