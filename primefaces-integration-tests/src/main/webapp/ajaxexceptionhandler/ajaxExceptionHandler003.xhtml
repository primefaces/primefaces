<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<f:view contentType="text/html;charset=UTF-8" encoding="UTF-8">
	<h:head>

	</h:head>

	<h:body>

		<!-- invalid responses must be reported with the error names of the Faces specification -->
		<p:ajaxExceptionHandler
			onexception="$('#exceptionName').text(errorName); $('#exceptionMessage').text(errorMessage);" />

		<div>Name: <span id="exceptionName"></span></div>
		<div>Message: <span id="exceptionMessage"></span></div>

		<h:form id="form">
			<p:commandButton id="emptyResponse" value="Empty Response"
				action="#{ajaxExceptionHandler003.emptyResponse}" />
			<p:commandButton id="noPartialResponse" value="No Partial Response"
				action="#{ajaxExceptionHandler003.noPartialResponse}" />
			<p:commandButton id="unparseableResponse" value="Unparseable Response"
				action="#{ajaxExceptionHandler003.unparseableResponse}" />
		</h:form>

	</h:body>
</f:view>

</html>
