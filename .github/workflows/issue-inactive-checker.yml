name: Close Inactive Needs Reproducer Issues

on:
  schedule:
    - cron: "0 13 * * 1" # Every Monday at 1PM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close-needs-reproducer:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Close inactive issues
        uses: actions/github-script@v9
        with:
          script: |
            const DAYS = 20;
            const cutoff = new Date(Date.now() - DAYS * 24 * 60 * 60 * 1000);

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                labels: "Status: Needs Reproducer",
                per_page: 100,
              }
            );

            console.log(`Found ${issues.length} issue(s).`);

            for (const issue of issues) {
              // Skip pull requests
              if (issue.pull_request) {
                continue;
              }

              const updated = new Date(issue.updated_at);

              if (updated <= cutoff) {
                console.log(
                  `Closing #${issue.number} (last updated ${issue.updated_at})`
                );

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `This issue has been automatically closed because it has had no activity for ${DAYS} days while awaiting a reproducer. If you can still reproduce the problem, please open a new issue and include a reproducer.`
                });

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "closed",
                  state_reason: "not_planned"
                });
              } else {
                console.log(
                  `Keeping #${issue.number} open (last updated ${issue.updated_at})`
                );
              }
            }
