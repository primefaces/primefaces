name: Continuous Integration

on:
  push:
    paths-ignore:
      - '**/**.md'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/**.md'

env:
  MAVEN_OPTS: >-
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
  SCREENSHOT_DIRECTORY: '/tmp/pf_it/'

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    strategy:
      fail-fast: false
      matrix:
        java: [11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Build
        run: mvn clean install -T1C -Pminify --batch-mode --show-version

  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests (Java ${{ matrix.java }} - ${{ matrix.facesimpl }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Java 11 with Faces 2.3
          - java: 11
            facesimpl: 'mojarra-2.3'
          - java: 11
            facesimpl: 'myfaces-2.3'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'
      - name: Build
        run: mvn clean install -T1C -DskipTests -Dcheckstyle.skip -Djsdoc.skip.typedoc=true -Dmaven.javadoc.skip=true --batch-mode --show-version
      - name: Integration Tests
        run: mvn -B -V clean install -fprimefaces-integration-tests/pom.xml -Pintegration-tests,parallel-execution,headless,chrome,theme-saga,csp,${{ matrix.facesimpl }}
      - name: Upload failure-screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed_tests_screenshots_java${{ matrix.java }}_${{ matrix.facesimpl }}
          if-no-files-found: ignore
          path: /tmp/pf_it/

  publish-snapshot:
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    if: github.repository == 'primefaces/primefaces' && github.event_name == 'push' && github.ref == 'refs/heads/13.X'
    name: Publish Snapshot
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Check SNAPSHOT version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Project version: $VERSION"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping snapshot publish: version is not a SNAPSHOT"
          fi
      - name: Build for deployment
        if: steps.version.outputs.publish == 'true'
        run: mvn -Prelease --batch-mode --show-version
      - name: Publish snapshot
        if: steps.version.outputs.publish == 'true'
        env:
          JRELEASER_NEXUS2_SNAPSHOT_DEPLOY_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          JRELEASER_NEXUS2_SNAPSHOT_DEPLOY_PASSWORD: ${{ secrets.SONATYPE_TOKEN }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
        run: mvn -N jreleaser:deploy --batch-mode --show-version
